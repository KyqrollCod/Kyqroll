# 見た目と品質基準。チャンネルの「型」はここだけで決める（変更はPRで）。
# 色は "#RRGGBB"。位置・サイズはピクセル（キャンバス基準）。矩形は 0〜1 の比率 [x, y, w, h]。

fonts_dir: assets/fonts
font_telop: "Rounded Mplus 1c Black"     # 字幕・帯（assets/fonts/MPLUSRounded1c-Black.ttf）
font_impact: "Dela Gothic One"           # オチ・サムネ（assets/fonts/DelaGothicOne-Regular.ttf）
font_telop_file: MPLUSRounded1c-Black.ttf
font_impact_file: DelaGothicOne-Regular.ttf
fonts:                                     # key: [ファイル, フォント名]（すべて OFL。thumbnail_font / telop_font / hook_font で key を指定）
  dela: [DelaGothicOne-Regular.ttf, Dela Gothic One]          # 極太ゴシック（従来のサムネ・オチ）
  mplus: [MPLUSRounded1c-Black.ttf, Rounded Mplus 1c Black]   # 丸ゴシック（従来のテロップ）
  zenkaku: [ZenKakuGothicNew-Black.ttf, Zen Kaku Gothic New Black]   # 角ゴシック極太（硬派・ニュース風）
  rocknroll: [RocknRollOne-Regular.ttf, RocknRoll One]        # 丸くて力強い（ポップ）
  reggae: [ReggaeOne-Regular.ttf, Reggae One]                 # 角ばった勢い（バトル・叫び）
  mochiy: [MochiyPopOne-Regular.ttf, Mochiy Pop One]          # ぽってり可愛い
  potta: [PottaOne-Regular.ttf, Potta One]                    # 筆っぽいポップ（ドタバタ）
  rampart: [RampartOne-Regular.ttf, Rampart One]              # 立体の袋文字（目立つ見出し）
  yusei: [YuseiMagic-Regular.ttf, Yusei Magic]                # マーカー手書き（ゆるい・小声）
  kaisei: [KaiseiDecol-Bold.ttf, Kaisei Decol]                # 明朝系（ホラー・シリアス）
  hachimaru: [HachiMaruPop-Regular.ttf, Hachi Maru Pop]       # 丸文字（かわいい）
  dot: [DotGothic16-Regular.ttf, DotGothic16]                 # ドット（レトロゲーム）

encode:
  encoder: libx264        # NVIDIA GPU なら h264_nvenc
  crf: 18
  preset: slow
  maxrate: 8M             # 上限ビットレート（動きの激しいゲームで巨大化しないように。YouTube 1080p60 推奨は 12M 以下）
  audio_bitrate: 192k

short:
  size: [1080, 1920]
  fps: 60                 # 元が30fpsなら30のまま（水増ししない）
  layout: letterbox       # letterbox（中央に横画面）| split（顔カメラ上＋ゲーム下）| crop（縦に切り抜き）
  min_sec: 15
  max_sec: 179            # YouTube ショートの上限は3分
  background: "#000000"
  band:                   # 上部の帯（テーマ・コラボ名など）
    y: 270
    h: 190
    color: "#F2F2F2"
    text_color: "#FFFFFF"
    outline_color: "#111111"
    outline: 9
    font_size: 112
  video_y: 650            # letterbox 時の横画面の上端
  hook:                   # 下部の大きなオチ・煽り文
    y: 1320
    font_size: 120
    color: "#FFFFFF"
    outline_color: "#000000"
    outline: 10
    max_chars_per_line: 9
  subs:                   # 発言テロップ
    font_size: 96
    bottom_y: 1250        # 字幕の下端（letterbox は横画面の下端付近）
    max_chars_per_line: 11
    max_lines: 2
    outline_inner: 7      # 白フチ
    outline_outer: 14     # 外側の濃いフチ
    inner_color: "#FFFFFF"
    outer_color: "#2A1A0A"
    emph_color: "#FFE600"
    emph_scale: 125
  speakers:               # 話者ごとの字幕色（align が 配信者/相手/読み上げ を自動で付ける。script の @配信者: などで上書き）
    default: "#FF8A1F"
    配信者: "#4FD4FF"
    相手: "#FFA040"
    読み上げ: "#A6E35A"
  name_labels: []         # [{text: "ざき", x: 540, y: 690, color: "#FF8A1F"}]（letterbox 時に常時表示）
  crop:
    center_x: 0.5         # crop 時の切り抜き中心（0=左端, 1=右端）
  split:
    face: [0.70, 0.05, 0.28, 0.40]   # 顔カメラ（立ち絵）の位置。calibrate で決める
    game: [0.0, 0.0, 1.0, 1.0]
    face_h: 760
  avatar:                 # layout: avatar（背景にぼかしたゲーム、上にゲーム画面、立ち絵を大きく重ねる）
    game_y: 330           # ゲーム画面(16:9)の上端
    height: 1010          # 立ち絵の高さ
    x: 240                # 立ち絵の左端（右側は画面外にはみ出してよい）
    bottom_overflow: 70   # 立ち絵の下端を画面外へ出す量
    talk_bob: 0           # 本人が話している間の上下の弾み(px)。0で静止（オーナー指示 2026-11-21）
    hook_y: 70            # 上部の大きな一文（hook）の上端
    subs_bottom_y: 1215   # テロップの下端
    badge: {x: 36, y: 1290, size: 230}   # 共演者・コメント読み上げのアイコン位置（左側）
    bg_blur: 26
    bg_dim: 0.32
  avatar_presets:         # avatar_style: で選ぶ構図（オーナー 2026-11-23: 構図のバリエーションを増やす）
    standard: {}          # ゲーム上・立ち絵右下に大きく
    big_game: {game_zoom: 1.3, game_y: 300, height: 760, x: 470, subs_bottom_y: 1330, badge: {x: 36, y: 1380, size: 210}}   # ゲームを大きく、立ち絵は小さめ
    left: {x: -190, badge: {x: 690, y: 1290, size: 230}}   # 立ち絵を左に（反転はしない。flip: true で反転も可）
    small: {game_y: 430, height: 620, x: 560, bottom_overflow: 40, hook_y: 110, subs_bottom_y: 1330, badge: {x: 36, y: 1380, size: 210}}   # ゲーム中央・立ち絵は右下に小さく
  stack:                  # layout: stack（上にゲーム全体、下にゲームの一部を拡大した窓）
    game_y: 250
    panel_y: 900
    panel_h: 620
    margin: 40
    focus: [0.30, 0.25, 0.40, 0.50]   # 拡大する範囲 [x, y, w, h]（0〜1）。クリップの stack_focus で指定
    frame_color: "#37E0FF"
    hook_y: 40
    subs_bottom_y: 1500
    badge: {x: 36, y: 1290, size: 230}
  auto_se: true           # 強調行=pop、ズーム=whoosh、keep=impact、読み上げ=ding を自動で付ける
  bgm: comical            # comical / tension / none（clips.src.yaml の package.bgm やクリップの bgm で上書き）
  bgm_db: -27             # BGM の音量（オーナー 2026-11-23: あくまで背景。声が出ている間はさらに自動で下がる）
  safe:                   # YouTube ショートのUIに隠れる領域（ここに文字を置かない）
    bottom_px: 300
    right_px: 140

long:
  size: [1920, 1080]
  fps: 60
  min_sec: 180
  target_min_sec: 600     # 目安の下限（オーナー 2026-11-22: 10分ぐらいが最低ラインの目安。下回ると警告）
  background: "#000000"
  subs:
    font_size: 80         # オーナー指示 2026-11-21: 大きく、少し上に
    bottom_y: 960         # 下端。YouTube のシークバーと操作ボタン（下約80px）に被らない高さ
    max_chars_per_line: 20
    max_lines: 2
    outline_inner: 7
    outline_outer: 14
    inner_color: "#FFFFFF"
    outer_color: "#2A1A0A"
    emph_color: "#FFE600"
    emph_scale: 125
  speakers:
    default: "#FF8A1F"
    配信者: "#4FD4FF"
    相手: "#FFA040"
    読み上げ: "#A6E35A"
  auto_se: true
  bgm: comical
  bgm_db: -30             # 横型はさらに控えめに（ゲーム音が主役）
  label:                  # 左上の常時ラベル（ゲーム名・局面など）
    x: 40
    y: 36
    font_size: 54
    color: "#FFE600"
    outline_color: "#000000"
    outline: 7

timeline:                 # 無言の間を詰める
  pad: 0.12               # 発話の前後に残す秒数
  max_gap: 0.55           # これより長い無音は詰める
  keep_gap: 0.18          # 詰めた後に残す間
  min_segment: 0.35

audio:
  lufs: -14
  true_peak: -2.0         # AAC でわずかに上がる分の余裕を見て -2.0（qc の基準は -1.0 以下）
  lra: 11
  se_volume: 0.8

thumbnail:
  size: [1280, 720]
  band_h: 230
  band_color: "#000000"
  text_color: "#FFFFFF"
  key_color: "#FF4040"     # 『』で囲んだ語の色（括弧自体は白）
  stroke_color: "#000000"
  stroke: 14
  border_colors: ["#FF2020", "#FFE600"]
  fonts: [dela, zenkaku, rocknroll, reggae, mochiy, potta, rampart]   # 自動で選ぶ候補（kaisei・yusei・hachimaru・dot は内容に合う時に thumbnail_font で指定）
  auto_palettes: [classic, neon, pop, fire, mint, paper, sky]          # 自動で選ぶ配色（horror はホラーゲームの時に thumbnail_palette で指定）
  palettes:               # thumbnail_palette で指定（未指定なら配信とクリップで自動に変わる）
    classic: {text: "#FFFFFF", key: "#FF4040", stroke: "#000000", accent: "#FFE600", accent2: "#FF2020", band: "#000000"}
    neon:    {text: "#FFFFFF", key: "#37E0FF", stroke: "#0B0F2E", accent: "#9146FF", accent2: "#37E0FF", band: "#0B0F2E"}
    pop:     {text: "#FFFFFF", key: "#FF5AA5", stroke: "#3A1640", accent: "#FFD23F", accent2: "#FF5AA5", band: "#3A1640"}
    fire:    {text: "#FFF35A", key: "#FF3B3B", stroke: "#000000", accent: "#FF7A00", accent2: "#FF3B3B", band: "#1A0500"}
    mint:    {text: "#FFFFFF", key: "#3BFF9E", stroke: "#06261A", accent: "#3BFF9E", accent2: "#00B3A4", band: "#06261A"}
    paper:   {text: "#111111", key: "#E8202A", stroke: "#FFFFFF", accent: "#111111", accent2: "#E8202A", band: "#FFFFFF"}
    sky:     {text: "#FFFFFF", key: "#FFE14D", stroke: "#0D3B66", accent: "#3FA9F5", accent2: "#FFE14D", band: "#0D3B66"}
    horror:  {text: "#F2F2F2", key: "#E01010", stroke: "#000000", accent: "#7A0000", accent2: "#E01010", band: "#0A0000"}

analysis:
  bin_sec: 1.0
  chat_lag_sec: 6          # チャットは発言から数秒遅れて盛り上がる
  smooth_sec: 5
  weights: {chat: 1.0, react: 1.3, audio: 0.8, keyword: 0.7, event: 1.6}
  react_patterns: ["草", "w{2,}", "ｗ{2,}", "笑", "8{3,}", "８{3,}", "やば", "ヤバ", "えぐ", "エグ", "神", "[!！][?？]", "うま", "つよ", "強すぎ", "かわいい", "かわよ", "？{2,}", "\\?{2,}", "lol", "LOL", "KEKW", "LUL"]
  min_gap_sec: 75          # 候補どうしの最小間隔
  candidates: 15
  short_window: [-28, 12]  # ピークからの切り出し幅（前, 後）
  long_window: [-240, 120]
  sentence_gap: 0.7        # この長さ以上の無音を文の切れ目とみなす

qc:
  lufs_tolerance: 1.0
  max_silence_sec: 1.2
  max_black_sec: 0.4
  max_freeze_sec: 2.5
  max_line_chars_short: 11
  max_line_chars_long: 20
  contact_sheet_every_sec: 3
