<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>portfolio card</title>
<!-- Portfolio image for a Coconala listing. Render at 1220x1240 with #<sample-folder>, e.g. #piano-kids -->
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fbf6ee;--ink:#2f2a26;--sub:#6b625a;--line:#e8dccb;--green:#3f7a5c}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1220px;height:1240px;overflow:hidden}
  body{font-family:"Zen Maru Gothic",sans-serif;background:var(--paper);color:var(--ink)}
  .label{position:absolute;left:48px;top:40px;right:48px;display:flex;justify-content:space-between;align-items:center}
  .label b{font-size:46px;font-weight:900}
  .label span{font-size:30px;font-weight:700;background:var(--ink);color:#fff;border-radius:999px;padding:8px 24px}
  .pc{position:absolute;left:48px;top:150px;width:780px;height:1040px;border:4px solid var(--ink);border-radius:24px;overflow:hidden;background:#fff}
  .pc iframe{width:1280px;height:1707px;border:0;transform:scale(.6031);transform-origin:0 0}
  .sp{position:absolute;right:48px;top:300px;width:330px;height:700px;border:5px solid var(--ink);border-radius:44px;overflow:hidden;background:#fff;padding-top:0}
  .sp iframe{width:390px;height:827px;border:0;transform:scale(.8205);transform-origin:0 0}
  .cap{position:absolute;right:48px;top:1030px;width:330px;font-size:28px;font-weight:700;color:var(--sub);line-height:1.5;text-align:center}
</style>
</head>
<body>
<div class="label"><b id="name"></b><span>制作サンプル（架空の事業者）</span></div>
<div class="pc"><iframe id="pc" scrolling="no"></iframe></div>
<div class="sp"><iframe id="sp" scrolling="no"></iframe></div>
<p class="cap">スマホ（左はPC表示）</p>
<script>
  const names = {"piano-kids":"ピアノ教室の体験申込LP","english-coach":"英会話コーチの無料相談LP","career-coach":"キャリアコーチの無料相談LP"};
  const k = location.hash.slice(1) || "piano-kids";
  document.getElementById("name").textContent = names[k] || k;
  const src = "../../../samples/" + k + "/index.html";
  document.getElementById("pc").src = src;
  document.getElementById("sp").src = src;
</script>
</body>
</html>
