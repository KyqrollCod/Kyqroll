<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>thumbnail copywriting</title>
<!-- Coconala listing thumbnail for the 3,000 yen 紹介文・キャッチコピー (listing E). Render at 1220x1240. No AI illustration. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fbf6ee;--card:#fff;--ink:#2f2a26;--sub:#6b625a;--green:#3f7a5c;--peach:#f2c9a8;--line:#e8dccb}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1220px;height:1240px;overflow:hidden}
  body{font-family:"Zen Maru Gothic",sans-serif;background:var(--paper);color:var(--ink);position:relative}
  .frame{position:absolute;inset:36px;border:4px solid var(--ink);border-radius:48px;overflow:hidden}
  .tag{position:absolute;left:72px;top:70px;font-size:40px;font-weight:700;background:var(--card);border:4px solid var(--ink);border-radius:999px;padding:10px 34px}
  .price{position:absolute;right:70px;top:66px;background:var(--green);color:#fff;border-radius:28px;padding:14px 30px;font-size:58px;font-weight:900}
  .price small{font-size:34px}
  h1{position:absolute;left:72px;top:180px;font-size:112px;line-height:1.22;font-weight:900}
  h1 em{font-style:normal;background:linear-gradient(transparent 60%,var(--peach) 60%)}
  .sub{position:absolute;left:76px;top:480px;font-size:46px;font-weight:700;color:var(--sub);line-height:1.5}
  .card{position:absolute;left:72px;top:650px;width:1004px;background:var(--card);border:4px solid var(--ink);border-radius:32px;padding:34px 40px}
  .row{display:flex;align-items:center;gap:24px;font-size:42px;font-weight:700;padding:16px 0;border-bottom:3px dashed var(--line)}
  .row:last-child{border-bottom:none}
  .num{flex:none;min-width:150px;height:70px;border-radius:999px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:36px;font-weight:900;padding:0 20px}
</style>
</head>
<body>
<div class="frame">
  <div class="tag">講師・教室・コーチの方へ</div>
  <div class="price">3,000<small>円</small></div>
  <h1>教室の紹介文と<br><em>キャッチコピー</em></h1>
  <p class="sub">質問5つに答えるだけ。ページ・チラシ・<br>SNSにそのまま使える文章をお届け</p>
  <div class="card">
    <div class="row"><span class="num">紹介文</span>300〜600字を1本</div>
    <div class="row"><span class="num">10案</span>型の違うキャッチコピー</div>
    <div class="row"><span class="num">2日</span>回答がそろってからお届け</div>
  </div>
</div>
</body>
</html>
