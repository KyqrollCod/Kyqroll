<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>thumbnail diagnosis</title>
<!-- Coconala listing thumbnail for the 3,000 yen LP/HP diagnosis. Render at 1220x1240. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fbf6ee;--card:#fff;--ink:#2f2a26;--sub:#6b625a;--green:#3f7a5c;--peach:#f2c9a8;--line:#e8dccb;--red:#c8553d}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1220px;height:1240px;overflow:hidden}
  body{font-family:"Zen Maru Gothic",sans-serif;background:var(--paper);color:var(--ink);position:relative}
  .frame{position:absolute;inset:36px;border:4px solid var(--ink);border-radius:48px;overflow:hidden}
  .tag{position:absolute;left:72px;top:70px;font-size:40px;font-weight:700;background:var(--card);border:4px solid var(--ink);border-radius:999px;padding:10px 34px}
  h1{position:absolute;left:72px;top:170px;font-size:118px;line-height:1.2;font-weight:900}
  h1 em{font-style:normal;background:linear-gradient(transparent 60%,var(--peach) 60%)}
  .sub{position:absolute;left:76px;top:485px;font-size:46px;font-weight:700;color:var(--sub);line-height:1.5}
  .list{position:absolute;left:72px;top:660px;width:640px;background:var(--card);border:4px solid var(--ink);border-radius:32px;padding:30px 36px}
  .row{display:flex;align-items:center;gap:20px;font-size:38px;font-weight:700;padding:12px 0;border-bottom:3px dashed var(--line)}
  .row:last-child{border-bottom:none}
  .num{flex:none;width:62px;height:62px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:36px;font-weight:900}
  .phone{position:absolute;right:70px;top:690px;width:320px;height:500px;background:var(--card);border:5px solid var(--ink);border-radius:56px;padding:46px 28px 28px;transform:rotate(4deg)}
  .phone::before{content:"";position:absolute;top:18px;left:50%;width:90px;height:10px;border-radius:9px;background:var(--ink);transform:translateX(-50%)}
  .blk{border-radius:14px;background:var(--line);margin-bottom:18px;position:relative}
  .b1{height:140px;background:var(--peach)}.b2{height:26px;width:85%}.b3{height:26px;width:60%}.b4{height:110px}
  .mark{position:absolute;border:6px solid var(--red);border-radius:50%}
  .m1{width:150px;height:90px;right:-20px;top:-14px}
  .m2{width:130px;height:130px;left:-24px;bottom:-30px}
  .price{position:absolute;right:70px;top:66px;background:var(--green);color:#fff;border-radius:28px;padding:14px 30px;font-size:58px;font-weight:900}
  .price small{font-size:34px}
</style>
</head>
<body>
<div class="frame">
  <div class="tag">講師・教室・コーチの方へ</div>
  <div class="price">3,000<small>円</small></div>
  <h1>申込が増えない<br><em>ページを診断</em></h1>
  <p class="sub">URLを送るだけ。スマホとPCの画面を見て<br>直す順番つきの改善点を10個お届け</p>
  <div class="list">
    <div class="row"><span class="num">1</span>最初の画面で伝わるか</div>
    <div class="row"><span class="num">2</span>料金と申込の分かりやすさ</div>
    <div class="row"><span class="num">3</span>スマホでの読みやすさ</div>
  </div>
  <div class="phone">
    <div class="blk b1"><span class="mark m1"></span></div>
    <div class="blk b2"></div><div class="blk b3"></div>
    <div class="blk b4"><span class="mark m2"></span></div>
  </div>
</div>
</body>
</html>
