<meta charset="utf-8">
<title>Claude Showreel</title>
<meta name="description" content="A fifteen-second motion design showreel, rendered frame by frame from canvas code with a synthesized, beat-synced soundtrack.">
<style>
@font-face{font-family:"Unbounded";src:url("fonts/unbounded-800.woff2") format("woff2");font-weight:800;font-display:block}
@font-face{font-family:"Unbounded";src:url("fonts/unbounded-400.woff2") format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"Instrument Serif";src:url("fonts/instrument-serif-italic.woff2") format("woff2");font-style:italic;font-weight:400;font-display:block}
@font-face{font-family:"Martian Mono";src:url("fonts/martian-mono-500.woff2") format("woff2");font-weight:500;font-display:block}
@font-face{font-family:"Dela Gothic One";src:url("fonts/dela-gothic-jp.woff2") format("woff2");font-display:block}

/* Screening-room page: a deliberate single dark look, painted explicitly. */
:root{
  color-scheme:dark;
  --ink:#0D0D12; --panel:#15161E; --line:#2A2C38; --paper:#F5F6F8; --muted:#9A9EAD;
  --pink:#FF2E88; --yellow:#FFD400; --klein:#2A3BFF;
}
html,body{background:var(--ink);color:var(--paper)}
body{font:14px/1.55 "Martian Mono",ui-monospace,"DejaVu Sans Mono",monospace;padding-inline:clamp(16px,4vw,48px);padding-block:28px 56px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
h1{margin:0;font:800 clamp(26px,5.2vw,54px)/1 Unbounded,"Arial Black",sans-serif;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--pink)}
.meta{margin:0;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;outline:1px solid var(--line)}
.screen canvas{display:block;width:100%;height:100%}
.bigplay{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:0;background:var(--pink);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.bigplay:hover{transform:scale(1.08)}
.bigplay svg{width:30px;height:30px;margin-left:5px}
.controls{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
.pp{min-width:88px;padding:9px 14px;border:1px solid var(--line);background:var(--panel);color:var(--paper);font:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.pp:hover{border-color:var(--pink)}
input[type=range]{width:100%;accent-color:var(--pink)}
.tc{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chapters{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.chapters button{width:100%;display:grid;gap:3px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:transparent;color:var(--paper);font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.chapters button:hover{border-color:var(--pink)}
.chapters button[aria-current="true"]{border-color:var(--yellow);background:var(--panel)}
.chapters .t{color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.note{margin:0;color:var(--muted);font-size:12px;max-width:68ch}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
@media (max-width:520px){.controls{grid-template-columns:auto 1fr}.tc{grid-column:1/-1}}
body.render{padding:0;margin:0;background:#000}
body.render .ui{display:none!important}
body.render .wrap{max-width:none;display:block}
body.render .screen{width:1920px;height:1080px;outline:0}
</style>

<div class="wrap">
  <header class="ui">
    <h1>Claude<span>.</span> Showreel</h1>
    <p class="meta">Motion design reel · 0:15 · 1920×1080 · 60p · 128 bpm</p>
  </header>
  <div class="screen">
    <canvas id="c" width="1920" height="1080" aria-label="Showreel"></canvas>
    <button id="big" class="bigplay ui" type="button" aria-label="Play the reel with sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l16 9-16 9z" fill="currentColor"/></svg></button>
  </div>
  <div class="controls ui">
    <button id="pp" class="pp" type="button">Play</button>
    <input id="scrub" type="range" min="0" max="899" step="1" value="870" aria-label="Timeline position">
    <span id="tc" class="tc">00:00:14:30 / 00:00:15:00</span>
  </div>
  <ol id="chapters" class="chapters ui" aria-label="Scenes"></ol>
  <p class="note ui">Every frame is drawn live in your browser by the canvas code on this page, and the soundtrack is synthesized on load with the Web Audio API. Nothing here is footage, stock or a template.</p>
</div>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ *
 *  CONFIG — swap in your own name to make the reel yours.
 * ------------------------------------------------------------------ */
const CONFIG = { name: 'CLAUDE', role: 'MOTION DESIGNER', roleJP: 'モーションデザイナー', year: '2026' };

const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');
if (RENDER) document.body.classList.add('render');

const W = 1920, H = 1080, FPS = 60, BPM = 128, BEAT = 60 / BPM, DUR = 15, FRAMES = DUR * FPS;
const COL = {
  ink: '#0D0D12', ink2: '#1B1C26', white: '#F5F6F8', klein: '#2A3BFF', kleinLt: '#5E6DFF',
  pink: '#FF2E88', yellow: '#FFD400', grey: '#C3C6D1'
};
const F = {
  disp: px => `800 ${px}px Unbounded, "Arial Black", sans-serif`,
  dispL: px => `400 ${px}px Unbounded, Arial, sans-serif`,
  serif: px => `italic 400 ${px}px "Instrument Serif", Georgia, serif`,
  mono: px => `500 ${px}px "Martian Mono", "DejaVu Sans Mono", monospace`,
  jp: px => `400 ${px}px "Dela Gothic One", "IPAGothic", sans-serif`
};

/* ------------------------------------------------------------------ *
 *  Math, easing, springs
 * ------------------------------------------------------------------ */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (a, b, x) => clamp((x - a) / (b - a));
const frac = x => x - Math.floor(x);
const hash = n => frac(Math.sin(n * 127.1 + 311.7) * 43758.5453);

function cubicBezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t;
  const sy = t => ((ay * t + by) * t + cy) * t;
  const dx = t => (3 * ax * t + 2 * bx) * t + cx;
  const solve = x => {
    let t = x;
    for (let i = 0; i < 8; i++) {
      const e = sx(t) - x; if (Math.abs(e) < 1e-6) return t;
      const d = dx(t); if (Math.abs(d) < 1e-6) break; t -= e / d;
    }
    let lo = 0, hi = 1; t = x;
    for (let i = 0; i < 40; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (x > v) lo = t; else hi = t; t = (lo + hi) / 2; }
    return t;
  };
  const f = x => x <= 0 ? 0 : x >= 1 ? 1 : sy(solve(x));
  f.pts = [x1, y1, x2, y2];
  return f;
}

const E = {
  lin: t => t,
  inQuad: t => t * t,
  outQuad: t => 1 - (1 - t) * (1 - t),
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  inQuart: t => t * t * t * t,
  outQuart: t => 1 - Math.pow(1 - t, 4),
  inOutQuart: t => t < .5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2,
  inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inOutExpo: t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
  inBack: (t, s = 1.70158) => (s + 1) * t * t * t - s * t * t,
  // Named curves. The principles scene plots these in its graph editor, and uses them for real.
  expoOut: cubicBezier(.16, 1, .3, 1),
  overshoot: cubicBezier(.34, 1.56, .64, 1),
  anticipate: cubicBezier(.36, 0, .66, -.56),
  snap: cubicBezier(.83, 0, .17, 1)
};

// Damped spring step response (t in seconds).
function spring(t, f = 2.4, z = .32) {
  if (t <= 0) return 0;
  const w = TAU * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
// Decaying oscillation that starts and ends at 0 (squash wobble).
const wobble = (t, f = 4, d = 7) => t <= 0 ? 0 : Math.exp(-d * t) * Math.sin(TAU * f * t);

function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`;
}
function rgba(h, a) { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

/* ------------------------------------------------------------------ *
 *  Canvas helpers
 * ------------------------------------------------------------------ */
const main = document.getElementById('c');
const mctx = main.getContext('2d');
function mkLayer() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }
const L = { sub: mkLayer(), a: mkLayer(), fx: mkLayer(), fx2: mkLayer() };
function freshCtx(cv) {
  const x = cv.getContext('2d');
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  x.clearRect(0, 0, W, H);
  return x;
}
function bg(c, col) { c.fillStyle = col; c.fillRect(-80, -80, W + 160, H + 160); }
function setFont(c, f, ls = 0) { c.font = f; c.letterSpacing = ls + 'px'; }
function ell(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), 0, 0, TAU); }
function letterXs(c, str) {
  const xs = [];
  for (let i = 0; i < str.length; i++) xs.push(c.measureText(str.slice(0, i)).width);
  return { xs, w: c.measureText(str).width };
}
function fontPx(c) { const m = /(\d+(?:\.\d+)?)px/.exec(c.font); return m ? parseFloat(m[1]) : 16; }
// Typewriter reveal. Always left-aligned from x.
function typeText(c, str, x, y, p, cursor = true) {
  if (p <= 0) return;
  const n = Math.floor(str.length * clamp(p) + 1e-6);
  const s = str.slice(0, n);
  c.textAlign = 'left';
  c.fillText(s, x, y);
  if (cursor && p < 1) {
    const w = c.measureText(s).width, fs = fontPx(c);
    const base = c.textBaseline === 'middle' ? y + fs * .45 : y + fs * .12;
    c.fillRect(x + w + 3, base - fs * .95, fs * .55, fs * .95);
  }
}
// Text that rises into place through a mask.
function maskRise(c, str, x, y, capH, e, desc = .3) {
  if (e <= 0) return;
  const w = c.measureText(str).width;
  c.save();
  c.beginPath(); c.rect(x - 60, y - capH * 1.6, w + 120, capH * (1.6 + desc)); c.clip();
  c.textAlign = 'left';
  c.fillText(str, x, y + (1 - e) * capH * (1.3 + desc));
  c.restore();
}
function spec(c, text, col, p) {
  if (p <= 0) return;
  c.save(); setFont(c, F.mono(13), 2.4); c.fillStyle = col; c.globalAlpha = .72; c.textBaseline = 'middle';
  typeText(c, text, 80, 96, p, true);
  c.restore();
}

/* ------------------------------------------------------------------ *
 *  Global camera shake, flashes and chromatic hits (all beat-locked)
 * ------------------------------------------------------------------ */
const SHAKES = [[4, 12], [8, 5], [12, 6], [16, 22], [20, 9], [24, 6], [28, 18]];
function shake(B) {
  let x = 0, y = 0;
  for (const [b, a] of SHAKES) {
    const s = (B - b) * BEAT; if (s < 0 || s > .6) continue;
    const env = a * Math.exp(-s * 9);
    x += env * Math.sin(s * 91 + b); y += env * Math.cos(s * 73 + b * 3);
  }
  return [x, y];
}
const FLASHES = [[16, .95], [20, .5], [28, .55]];
function flash(B) {
  let v = 0;
  for (const [b, a] of FLASHES) { const s = (B - b) * BEAT; if (s >= 0 && s < .3) v += a * Math.exp(-s * 28); }
  return clamp(v);
}
const CHROMA = [[4, .5], [8, .35], [12, .45], [16, 1], [20, .7], [24, .5], [28, .9]];
function chromaAt(t) {
  const B = t / BEAT; let v = 0;
  for (const [b, a] of CHROMA) { const s = (B - b) * BEAT; if (s >= 0 && s < .5) v += a * Math.exp(-s * 14); }
  // the whip pan gets a smear of its own
  v += .6 * Math.sin(Math.PI * prog(23.5, 24, B));
  return v;
}

/* ================================================================== *
 *  SC.00 — IGNITION  (beats 0–4)
 *  A dot drops, squashes, bounces, spreads into a line, splits into
 *  five lines and slams open into the title.
 * ================================================================== */
function s0(c, B) {
  bg(c, COL.ink);
  const cx = W / 2, cy = H / 2, r = 22;
  c.fillStyle = COL.white;
  if (B < 2) {
    let y, sx = 1, sy = 1;
    if (B < 1) {
      const p = clamp(B); y = lerp(-90, cy, p * p);
      const st = .6 * p * p; sy = 1 + st; sx = 1 - st * .35;
    } else {
      const q = B - 1, s = q * BEAT;
      y = cy - 160 * 4 * q * (1 - q);
      const w = wobble(s, 5, 10); sx = 1 + .75 * w; sy = 1 - .5 * w;
      const v = 1 - 2 * q, st = .3 * v * v * prog(.08, .2, q);
      sy *= 1 + st; sx *= 1 - st * .3;
    }
    ell(c, cx, y + r * (1 - sy), r * sx, r * sy); c.fill();
    if (B >= 1) {
      const q = prog(1, 1.9, B), e = E.outExpo(q);
      c.save(); c.globalAlpha = (1 - q) * .9; c.strokeStyle = COL.white; c.lineWidth = 2.5;
      ell(c, cx, cy + r, 24 + 420 * e, (24 + 420 * e) * .16); c.stroke(); c.restore();
    }
  } else if (B < 3) {
    const s = (B - 2) * BEAT;
    const w = lerp(2 * r, W + 240, E.outExpo(clamp(s / .6)));
    const h = lerp(2 * r, 6, E.outExpo(clamp(s / .25)));
    c.beginPath(); c.roundRect(cx - w / 2, cy - h / 2, w, h, h / 2); c.fill();
    const q = prog(2, 2.9, B);
    c.save(); c.globalAlpha = (1 - q) * .5; c.strokeStyle = COL.white; c.lineWidth = 2;
    ell(c, cx, cy, 30 + 700 * E.outExpo(q), (30 + 700 * E.outExpo(q)) * .08); c.stroke(); c.restore();
  } else {
    for (let k = 0; k < 5; k++) {
      const ty = 108 + 216 * k, d = Math.abs(k - 2), st = 3 + d * .07;
      const e = E.overshoot(prog(st, st + .42, B));
      const y = lerp(cy, ty, e);
      const h = lerp(6, 220, E.inExpo(prog(3.4 + k * .05, 3.8 + k * .05, B)));
      c.fillRect(-80, y - h / 2, W + 160, h);
    }
  }
}

/* ================================================================== *
 *  SC.01 — TITLE  (beats 4–8)
 * ================================================================== */
function s1(c, B) {
  bg(c, COL.white);
  const u = B - 4;
  const S = 250, A = 'MOTION', D = 'DESIGN';
  setFont(c, F.disp(S)); c.textBaseline = 'alphabetic';
  const la = letterXs(c, A), ld = letterXs(c, D);
  const capH = c.measureText('M').actualBoundingBoxAscent;
  const baseY = 600;
  const xa = W / 2 - la.w / 2, xd = W / 2 - ld.w / 2, maxW = Math.max(la.w, ld.w);

  // highlighter bar
  const bp = E.expoOut(prog(.45, 1.3, u)), bo = E.inExpo(prog(2.85, 3.2, u));
  const bx0 = W / 2 - maxW / 2 - 60, bw = maxW + 120;
  const x0 = bx0 + bw * bo, x1 = bx0 + bw * bp;
  if (x1 > x0) { c.fillStyle = COL.pink; c.fillRect(x0, baseY - capH * .38, x1 - x0, capH * .38 + 46); }

  // echo outlines
  const ep = E.expoOut(prog(2.3, 2.75, u)) * (1 - E.inCubic(prog(2.72, 3.1, u)));
  if (ep > .002) {
    c.save(); c.strokeStyle = COL.ink; c.lineWidth = 2; c.textAlign = 'left';
    for (let k = 1; k <= 3; k++) {
      c.globalAlpha = 1 - k * .24;
      for (const sg of [-1, 1]) c.strokeText(D, xd, baseY + sg * k * ep * capH * .66);
    }
    c.restore();
  }

  // letters: rise, then split-flap from MOTION to DESIGN
  c.fillStyle = COL.ink;
  for (let i = 0; i < 6; i++) {
    const st = i * .07, e = E.overshoot(prog(st, st + .85, u));
    if (e <= 0) continue;
    const fs = 1.5 + i * .08, fp = prog(fs, fs + .32, u);
    const ch = fp < .5 ? A[i] : D[i];
    const wA = (i < 5 ? la.xs[i + 1] : la.w) - la.xs[i];
    const wD = (i < 5 ? ld.xs[i + 1] : ld.w) - ld.xs[i];
    const xL = lerp(xa + la.xs[i], xd + ld.xs[i], E.inOutCubic(fp));
    const cw = lerp(wA, wD, fp);
    const sy = Math.max(.02, Math.abs(Math.cos(Math.PI * fp)));
    const yOff = (1 - e) * (capH + 80);
    c.save();
    c.beginPath(); c.rect(xL - 40, baseY - capH - 140, cw + 80, capH + 146); c.clip();
    c.translate(xL + cw / 2, baseY - capH / 2 + yOff); c.scale(1, sy);
    c.textAlign = 'center'; c.fillText(ch, 0, capH / 2);
    c.restore();
  }

  // kicker + subline
  c.fillStyle = COL.ink;
  setFont(c, F.mono(18), 4);
  typeText(c, 'SHOWREEL — ' + CONFIG.year, W / 2 - maxW / 2, baseY - capH - 56, prog(.7, 1.25, u));
  setFont(c, F.serif(58));
  const sp = E.expoOut(prog(1.0, 1.7, u));
  c.save(); c.globalAlpha = sp; c.textAlign = 'right';
  c.fillText('fifteen seconds, every frame written in code', W / 2 + maxW / 2, baseY + 118 + (1 - sp) * 30);
  c.restore();
}

function tSlices(c, B) {
  s2(c, B);
  const a = freshCtx(L.a); s1(a, B);
  const n = 8, hs = H / n;
  for (let k = 0; k < n; k++) {
    const st = 7.25 + (k % 2) * .06 + k * .015;
    const e = E.inQuart(prog(st, st + .55, B));
    const dx = (k % 2 ? 1 : -1) * e * (W + 120);
    if (Math.abs(dx) > W + 100) continue;
    c.drawImage(L.a, 0, k * hs, W, hs, dx, k * hs, W, hs);
  }
}

/* ================================================================== *
 *  SC.02 — KINETIC TYPE  (beats 8–12)
 * ================================================================== */
const SLOT = ['MOVE', 'FEEL', 'SNAP', 'POP', 'FLOW'];
const SLOT_T = [9, 9.5, 10, 10.5];
const SLOT_X = 180, SLOT_Y = 690, SLOT_S = 210;
function slotPos(B) { let p = 0; for (const t of SLOT_T) p += E.snap(prog(t, t + .34, B)); return p; }

// Geometry of a hand-drawn "O" ring that replaces the glyph (so we can fly through it).
function ringGeom(c, S, x0, y) {
  const m = c.measureText('O'), mi = c.measureText('I');
  const left = x0 - m.actualBoundingBoxLeft, right = x0 + m.actualBoundingBoxRight;
  const top = y - m.actualBoundingBoxAscent, bot = y + m.actualBoundingBoxDescent;
  const tx = (mi.actualBoundingBoxRight + mi.actualBoundingBoxLeft) * 1.02;
  return { cx: (left + right) / 2, cy: (top + bot) / 2, rx: (right - left) / 2, ry: (bot - top) / 2, tx, ty: tx * .86 };
}
function drawRingWord(c, word, x, y, S, ringScale = 1) {
  const lx = letterXs(c, word);
  c.textAlign = 'left';
  for (let i = 0; i < word.length; i++) {
    const x0 = x + lx.xs[i];
    if (word[i] === 'O') {
      const g = ringGeom(c, S, x0, y);
      const k = ringScale;
      c.beginPath();
      c.ellipse(g.cx, g.cy, g.rx * k, g.ry * k, 0, 0, TAU);
      c.ellipse(g.cx, g.cy, (g.rx - g.tx) * k, (g.ry - g.ty) * k, 0, 0, TAU, true);
      c.fill();
    } else c.fillText(word[i], x0, y);
  }
  return lx.w;
}
function flowRing(c) {
  setFont(c, F.disp(SLOT_S));
  const lx = letterXs(c, 'FLOW');
  return ringGeom(c, SLOT_S, SLOT_X + lx.xs[2], SLOT_Y);
}

function s2(c, B, cam) {
  bg(c, COL.klein);
  const u = B - 8;

/* ------------------------------------------------------------------ *
 *  HUD — the "viewport" a motion designer lives in
 * ------------------------------------------------------------------ */

  c.globalAlpha = .9 * a; c.textAlign = 'right';

  const bar = Math.floor(B / 4) + 1, beat = Math.floor(B % 4);

/* ------------------------------------------------------------------ *
 *  Frame assembly: scenes → motion blur → chroma → HUD
 * ------------------------------------------------------------------ */
function composeAt(c, B) {

  fc.setTransform(1, 0, 0, 1, 0, 0); fc.globalCompositeOperation = 'copy'; fc.drawImage(main, 0, 0);
  const tc = L.fx2.getContext('2d');

    tc.globalCompositeOperation = 'multiply'; tc.fillStyle = col; tc.fillRect(0, 0, W, H);
    mctx.globalCompositeOperation = 'lighter';
    mctx.setTransform(s, 0, 0, s, W / 2 * (1 - s), H / 2 * (1 - s));

}

  if ((B > 23.4 && B < 24.1) || (B > 11.2 && B < 12.05) || (B > 7.4 && B < 8.02)) return 24;
  return 10;
}

  const t0 = fi / FPS;

    const shutter = .5 / FPS;
    const sc = L.sub.getContext('2d');
    mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.globalCompositeOperation = 'source-over';

      mctx.globalAlpha = 1 / (k + 1);
      mctx.drawImage(L.sub, 0, 0);
    }
    mctx.globalAlpha = 1;
  }
  chroma(chromaAt(t0));

  const CH = {
    Fm: [53, 56, 60, 63, 67], Db: [49, 53, 56, 60, 63], Ab: [44, 51, 55, 60, 63], Eb: [51, 55, 58, 65, 70],
    AbEnd: [44, 51, 56, 58, 60, 63, 68]
  };
  const ROOT = { Fm: 41, Db: 37, Ab: 44, Eb: 39 };
  const BARS = ['Fm', 'Fm', 'Db', 'Ab', 'Eb', 'Fm', 'Db'];

  // intro: filtered pad blooming open
  const intro = pad(0, T(4) - .02, CH.Fm, .06, 500, 1.6, .06);
  intro.lp.frequency.setValueAtTime(420, 0); intro.lp.frequency.exponentialRampToValueAtTime(2600, T(4));
  for (let bar = 1; bar <= 6; bar++) {
    const t0 = T(bar * 4), t1 = bar === 6 ? T(27.5) : T(bar * 4 + 4) - .02;
    pad(t0, t1, CH[BARS[bar]], .042, 1700, .02, .08);
  }
  const endPad = pad(T(28), DUR - .05, CH.AbEnd, .065, 2300, .01, .05);
  endPad.g.gain.setValueAtTime(.065, T(30.2)); endPad.g.gain.linearRampToValueAtTime(.0001, DUR - .05);

  // drums + bass from the drop to the break
  for (let b = 4; b <= 27; b++) { kick(T(b), b === 4 || b === 16 || b === 20 || b === 24 ? 1.05 : .92); kickTimes.push(T(b)); }
  kick(T(28), 1.1); kickTimes.push(T(28));
  for (const t of kickTimes) { duck.gain.setValueAtTime(.28, t); duck.gain.linearRampToValueAtTime(1, t + .22); }
  for (let b = 5; b <= 27; b += 2) clap(T(b), .42);
  for (let s = 0; s < 24 * 4; s++) {
    const b = 4 + s / 4;
    if (s % 4 === 2) hat(T(b), .075, true); else hat(T(b), s % 4 === 0 ? .06 : .04);
  }
  for (let b = 4; b <= 27; b++) {
    const bar = Math.floor(b / 4), root = NOTE(ROOT[BARS[bar]]);
    bass(T(b + .5), .4 * BEAT, root);
    if (b % 2 === 1 && b < 27) bass(T(b + .75), .18 * BEAT, root * 2, .26);
  }
  for (let k = 0; k < 4; k++) snare(T(15 + k * .125), .1 + k * .03);
  for (let k = 0; k < 4; k++) snare(T(15.5 + k * .125), .2 + k * .05);

  // scene hits
  const hits = [[4, 'Fm', .7, .15], [8, 'Db', .25, .1], [12, 'Ab', .35, .1], [16, 'Eb', 1, .2], [20, 'Fm', .5, .12], [24, 'Db', .3, .1]];
  for (const [b, ch, imp, cr] of hits) { stab(T(b), CH[ch], .12, .32); impact(T(b), imp); crash(T(b), cr, 1.2); }
  impact(T(28), 1.2); crash(T(28), .26, 2.2); stab(T(28), CH.AbEnd, .2, .95);

  // SC.00
  blip(T(1), 1500, 700, .08, .22); kick(T(1), .35);
  blip(T(2), 900, 450, .1, .18); kick(T(2), .28); whoosh(T(2), .4, 400, 6000, .16);
  for (let k = 0; k < 5; k++) click(T(3) + Math.abs(k - 2) * T(.07) + k * .004, .14, 5200);
  riser(T(2.2), T(4) - .01, .2); swell(T(4) - .005, .8, .22);
  // SC.01
  for (let i = 0; i < 6; i++) click(T(4 + i * .07), .07, 6500);
  for (let i = 0; i < 6; i++) { const t = T(5.5 + i * .08 + .16); click(t, .22, 2800); click(t + .013, .12, 4400); }
  whoosh(T(6.3), .3, 800, 3000, .1, .5, -.5);
  whoosh(T(7.25), T(.75), 500, 6500, .28);
  // SC.02
  for (const b of SLOT_T) { click(T(b), .18, 2400); click(T(b + .3), .26, 1700); }
  blip(T(11), 500, 900, .12, .12);
  riser(T(11.25), T(12) - .01, .26); whoosh(T(11.2), .42, 200, 8000, .25, 0, 0);
  // SC.03
  blip(T(12.9), 420, 180, .12, .14);
  blip(T(13.12), 380, 900, .12, .12);
  kick(T(13.75), .32); blip(T(13.75), 260, 110, .14, .18);
  whoosh(T(14), .22, 900, 4000, .12, -.6, .6); whoosh(T(14.5), .22, 900, 4000, .12, .6, -.6);
  pluck(T(15), 80, .1, .25);
  swell(T(16) - .005, .3, .28); riser(T(14.6), T(16) - .01, .18);
  // SC.04
  wind(T(16.2), T(19.3), .09);
  const shimmer = [77, 80, 82, 84, 87, 89, 87, 84, 82, 80];
  shimmer.forEach((n, k) => pluck(T(17.5 + k * .125), n, .07, .22, (k % 2 ? .4 : -.4)));
  whoosh(T(19.35), .5, 300, 6000, .28, -.8, .8); swell(T(20) - .005, .7, .2);
  // SC.05
  zap(T(20), .14); zap(T(21), .1); zap(T(22), .1); zap(T(23), .1);
  whoosh(T(23.45), .36, 200, 7000, .34, .8, -.8);
  // SC.06
  const blp = [77, 80, 82, 84, 87, 89, 92, 94];
  TILES.map(t => t.t).sort((a, b) => a - b).forEach((b, k) => bleep(T(b), blp[k], .085));
  riser(T(26.4), T(27.45), .16);
  // SC.07
  blip(T(29.5), 1500, 620, .07, .2); blip(T(29.9), 1900, 900, .05, .1);
  for (let i = 0; i < CONFIG.role.length; i++) click(T(28.7 + i * .65 / CONFIG.role.length), .05, 5000);
  for (let i = 0; i < 24; i++) click(T(29.45 + i * .85 / 24), .035, 5600);
  const arp = [68, 72, 75, 77, 80, 84, 80, 77, 75, 72];
  arp.forEach((n, k) => pluck(T(28.5 + k * .5), n, .075 * (1 - k / 12), .35, (k % 2 ? .35 : -.35)));

  return await ac.startRendering();
}

/* ------------------------------------------------------------------ *
 *  Boot
 * ------------------------------------------------------------------ */
async function loadFonts() {
  const probes = [F.disp(100), F.dispL(100), F.serif(100), F.mono(20)];
  await Promise.all(probes.map(p => document.fonts.load(p, 'AaOo09')));
  await document.fonts.load(F.jp(100), '動モーション空間デザイナ');
  await document.fonts.ready;
  const missing = [...probes, F.jp(100)].filter(p => !document.fonts.check(p, p.includes('Dela') ? '動' : 'A'));
  return missing;
}

const ready = (async () => {
  const missing = await loadFonts();
  initP4(); initP5();
  return { missing };
})();

window.__ready = ready;
window.__frame = async (fi, n) => { renderFrame(fi, n ?? subframes(fi / FPS / BEAT)); return main.toDataURL('image/png'); };
window.__audio = async () => {
  const buf = await renderAudio();
  const a = buf.getChannelData(0), b = buf.getChannelData(1), n = a.length;
  let peak = 0, sum = 0;
  for (let i = 0; i < n; i++) { peak = Math.max(peak, Math.abs(a[i]), Math.abs(b[i])); sum += a[i] * a[i] + b[i] * b[i]; }
  const g = peak > 0 ? .891 / peak : 1;
  const pcm = new Int16Array(n * 2);
  for (let i = 0; i < n; i++) { pcm[2 * i] = clamp(a[i] * g, -1, 1) * 32767; pcm[2 * i + 1] = clamp(b[i] * g, -1, 1) * 32767; }
  const bytes = new Uint8Array(pcm.buffer); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return { b64: btoa(s), rate: buf.sampleRate, frames: n, peak, rms: Math.sqrt(sum / (2 * n)) };
};

if (RENDER) return;

/* ------------------------------------------------------------------ *
 *  Live player (page mode)
 * ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
const pp = $('pp'), big = $('big'), scrub = $('scrub'), tcEl = $('tc'), chapEl = $('chapters');
let playing = false, t = 870 / FPS, actx = null, srcNode = null, audioBuf = null, clock0 = 0, raf = 0;
const CHAPTERS = SCENES.map(([b, n, name]) => ({ t: Math.max(0, b) * BEAT, n, name }));
CHAPTERS.forEach((ch, i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.dataset.i = i;
  b.innerHTML = `<span class="t">${ch.t.toFixed(2).padStart(5, '0')}s</span><span>SC.${ch.n} ${ch.name}</span>`;
  b.addEventListener('click', () => { seek(ch.t); play(); });
  li.appendChild(b); chapEl.appendChild(li);
});
const audioReady = ready.then(() => renderAudio()).then(b => { audioBuf = b; }).catch(() => { audioBuf = null; });

function frameIndex() { return Math.min(FRAMES - 1, Math.max(0, Math.floor(t * FPS))); }
function draw() {
  const fi = frameIndex();
  renderFrame(fi, 1);
  scrub.value = fi;
  tcEl.textContent = `${tcode(fi)} / 00:00:15:00`;
  const B = t / BEAT;
  chapEl.querySelectorAll('button').forEach((b, i) => {
    const on = B >= SCENES[i][0] && (i === SCENES.length - 1 || B < SCENES[i + 1][0]);
    b.setAttribute('aria-current', on ? 'true' : 'false');
  });
}
function now() { return actx && srcNode ? actx.currentTime : performance.now() / 1000; }
function tick() {
  t = now() - clock0;
  if (t >= DUR) { t = DUR - 1 / FPS; stop(); draw(); return; }
  draw();
  raf = requestAnimationFrame(tick);
}
async function play() {
  if (playing) return;
  if (t >= DUR - 2 / FPS) t = 0;
  playing = true; big.hidden = true; pp.textContent = 'Pause';
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    await actx.resume();
    await audioReady;
  } catch (e) { /* play silently */ }
  if (!playing) return;
  if (actx && audioBuf) {
    srcNode = actx.createBufferSource(); srcNode.buffer = audioBuf; srcNode.connect(actx.destination);
    srcNode.start(0, t); clock0 = actx.currentTime - t;
  } else { srcNode = null; clock0 = performance.now() / 1000 - t; }
  cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
}
function stop() {
  playing = false; pp.textContent = 'Play'; big.hidden = false;
  cancelAnimationFrame(raf);
  if (srcNode) { try { srcNode.stop(); } catch (e) {} srcNode.disconnect(); srcNode = null; }
}
function seek(sec) { const was = playing; stop(); t = clamp(sec, 0, DUR - 1 / FPS); draw(); if (was) play(); }
pp.addEventListener('click', () => playing ? stop() : play());
big.addEventListener('click', play);
scrub.addEventListener('input', () => { stop(); t = +scrub.value / FPS; draw(); });
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playing ? stop() : play(); }
});
ready.then(draw);
})();
</script>
